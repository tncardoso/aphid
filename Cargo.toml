[workspace]
resolver = "3"
members = [
    "crates/aphid-agent",
    "crates/aphid-alate",
    "crates/aphid-cli",
    "crates/aphid-code",
    "crates/aphid-colony",
    "crates/aphid-core",
    "crates/aphid-nostr",
    "crates/aphid-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tncardoso/aphid"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
compact_str = { version = "0.9", features = ["serde"] }
croner = "3"
bytes = "1"
futures-core = "0.3"
# Default features are `std` alone. NIP-04, NIP-44 and NIP-59 are opt-in there
# and stay off: a colony is cleartext, and every one of them costs a cipher.
# `os-rng` is what `Keys::generate` needs.
nostr = { version = "0.45", features = ["os-rng"] }
ratatui = "0.30"
ratatui-textarea = "0.9"
# `bundled` builds SQLite from source rather than hunting for a system one on
# every new machine. It is behind the colony's `relay` feature, so a plain
# `cargo build` of aphid never pays for it.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
rhai = { version = "1.25", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "charset"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
thiserror = "2"
# Default features are `connect` and `handshake` and no TLS at all, which is
# what a loopback relay wants: `ws://` needs none, and refusing to pull one is
# the same instinct that made the alate gateway a Unix socket.
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
