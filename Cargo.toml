[workspace]
resolver = "3"
members = [
    "crates/aphid-agent",
    "crates/aphid-alate",
    "crates/aphid-cli",
    "crates/aphid-code",
    "crates/aphid-colony",
    "crates/aphid-core",
    "crates/aphid-nostr",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
# GPUI follows the current stable compiler. Keep the workspace on the same
# supported floor so the command-line and graphical applications ship together.
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/tncardoso/aphid"
homepage = "https://aphid.embornal.com"
# An inherited readme resolves from the workspace root, so the one README goes
# in each of the eight packages.
readme = "README.md"
keywords = ["agent", "llm", "ai", "harness", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
base64 = "0.22"
# The crates of this workspace. Each one carries a version as well as a path:
# a path alone is enough to build, and not enough to publish.
aphid-agent = { version = "0.2.0", path = "crates/aphid-agent" }
aphid-alate = { version = "0.2.0", path = "crates/aphid-alate" }
aphid-code = { version = "0.2.0", path = "crates/aphid-code" }
aphid-colony = { version = "0.2.0", path = "crates/aphid-colony" }
aphid-core = { version = "0.2.0", path = "crates/aphid-core" }
aphid-nostr = { version = "0.2.0", path = "crates/aphid-nostr" }

clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
compact_str = { version = "0.9", features = ["serde"] }
croner = "3"
bytes = "1"
futures-core = "0.3"
# `StreamExt::split` and `SinkExt::send`, which is all a websocket needs of it.
# It is already in the tree under tokio-tungstenite.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
gpui = "=0.2.2"
# The component library that both graphical interfaces are built on. It pins
# `gpui` at the same 0.2.2, so the exact version above is what it gets. It is
# what brings a text box with input-method support: `Keystroke.key_char` gives
# the key and not the composed character, so a dead key would type `´a` for `á`.
gpui-component = "0.5.1"
# What the companion window asks a desktop with, on the two systems whose
# desktops answer. Both are already in the tree — gpui's `x11` feature is built
# on x11rb, and its macOS backend on objc2 — so neither adds a build.
x11rb = "0.13"
# The creature is drawn in a context of its own and read back as pixels, since
# gpui exposes no seam onto its GPU. Blade is already in the tree: it is what
# gpui itself renders with on Linux.
blade-graphics = "0.7"
blade-macros = "0.3"
bytemuck = { version = "1", features = ["derive"] }
# The inline-vector crate the GUI stack builds on: already in the tree under
# gpui's fontdb and blade-graphics' gpu-alloc-ash. Its 1.13.0 does not compile
# on rustc 1.98 — `use alloc::vec::{self, Vec}` hides the `vec!` macro from its
# own `vec!` call — so the last good release is pinned until a fixed one ships.
tinyvec = "=1.12.0"
# Not re-exported by gpui, so it is named here. Cargo unifies it with the
# 0.25 already in the lock, and `image::Frame` is what `RenderImage` holds.
image = { version = "0.25", default-features = false }
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSView", "NSWindow"] }
# How the window's `NSView` is reached. Pinned to the 0.6 gpui itself uses: a
# handle from one version does not match the types of another.
raw-window-handle = "0.6"
# The tray icon, which is a different mechanism on each system. On Linux it is
# a StatusNotifierItem over D-Bus, and ksni speaks it without GTK — which the
# desktop companion this borrows from could not avoid, and had to run its tray
# in a subprocess for. On macOS it is an `NSStatusItem`; `default-features` is
# off because tray-icon's defaults are the Linux ones, GTK included.
ksni = "0.3"
tray-icon = { version = "0.24", default-features = false }
# The syscall behind `exec::kill`, called directly rather than by spawning the
# `kill` binary.
libc = "0.2"
# Speech to text, and the pieces that put audio in the shape it wants. All of
# them are behind the alate's `voice` feature, because the first of them pulls
# an ONNX runtime and the rest are of no use without it.
#
# `default-features = false` keeps every engine out but the ONNX ones, which is
# where Parakeet is. Parakeet reads a directory of ONNX files; it has no GGUF
# loader, so the model is the export at `istupakov/parakeet-tdt-0.6b-v3-onnx`.
transcribe-rs = { version = "0.3", default-features = false, features = ["onnx"] }
# The container and codec reader for everything that is not Opus: an mp3 sent
# as a file, the AAC track inside a video note, a wav. Pure Rust, and its
# default features are turned off so the list below is the whole of it.
symphonia = { version = "0.6", default-features = false, features = ["aac", "adpcm", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
# Opus is the one codec symphonia cannot decode, and it is the one Telegram
# always sends a voice message in. This decoder is pure Rust, passes the RFC
# 8251 vectors, and decodes straight to 16 kHz — which is the rate the model
# wants, so the voice path never resamples.
opus-decoder = "0.1"
# The Ogg pages a voice message is packed in. The decoder above takes packets.
ogg = "0.9"
# What brings the other formats to 16 kHz. Only the symphonia path needs it.
rubato = "5"
# The checksum a downloaded model file is measured against.
sha2 = "0.10"
# Default features are `std` alone. NIP-04, NIP-44 and NIP-59 are opt-in there
# and stay off: a colony is cleartext, and every one of them costs a cipher.
# `os-rng` is what `Keys::generate` needs.
nostr = { version = "0.45", features = ["os-rng"] }
ratatui = "0.30"
ratatui-textarea = "0.9"
# `bundled` builds SQLite from source rather than hunting for a system one on
# every new machine. It is behind the colony's `relay` feature, so a plain
# `cargo build` of aphid never pays for it.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
rhai = { version = "1.25", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "charset"] }
serde_json = "1"
# `sync` is reachable today only because reqwest pulls it in through hyper.
# The runtime depends on it directly, so it says so.
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
thiserror = "2"
# Default features are `connect` and `handshake` and no TLS at all, which is
# what a loopback relay wants: `ws://` needs none, and refusing to pull one is
# the same instinct that made the alate gateway a Unix socket.
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The profile that `dist` builds a release with.
[profile.dist]
inherits = "release"
lto = "thin"
