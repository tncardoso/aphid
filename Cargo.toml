[workspace]
resolver = "3"
members = [
    "crates/aphid-agent",
    "crates/aphid-alate",
    "crates/aphid-cli",
    "crates/aphid-code",
    "crates/aphid-core",
    "crates/aphid-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tncardoso/aphid"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
compact_str = { version = "0.9", features = ["serde"] }
croner = "3"
bytes = "1"
futures-core = "0.3"
ratatui = "0.30"
ratatui-textarea = "0.9"
serde = { version = "1", features = ["derive"] }
rhai = { version = "1.25", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "charset"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
