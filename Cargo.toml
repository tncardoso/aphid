[workspace]
resolver = "3"
members = ["crates/aphid-agent", "crates/aphid-cli", "crates/aphid-code", "crates/aphid-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thiagoncc/aphid"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
compact_str = { version = "0.9", features = ["serde"] }
bytes = "1"
futures-core = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "charset"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
thiserror = "2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
