{{ $p := .p }}
{{ $index := .index }}
<section
  id="{{ $p.id }}"
  class="product"
  style="{{ printf "--section-accent:var(%s);" $p.accent_var | safeCSS }}"
>
  <div class="product__inner{{ if $p.reverse }} product__inner--reverse{{ end }}">
    <div class="product__text">
      <p class="product__eyebrow"><span class="product__eyebrow-dot"></span>{{ printf "%02d" $index }} - {{ $p.title }}</p>
      <h2 class="product__title">{{ $p.heading }}</h2>
      <p class="product__description">{{ $p.description }}</p>
      <div class="cli-block">
        {{ range $p.cli }}
          <div class="cli-block__line">$ {{ . }}</div>
        {{ end }}
      </div>
    </div>
    <div class="terminal">
      <div class="terminal__bar">
        <span class="terminal__dot"></span>
        <span class="terminal__dot"></span>
        <span class="terminal__dot"></span>
        <span class="terminal__title">{{ $p.terminal.title }}</span>
      </div>
      <div class="terminal__body terminal__body--media">
        {{ with resources.Get (printf "%s.gif" $p.id) }}
          <img class="terminal__media" src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="{{ $p.title }} terminal recording" loading="lazy">
        {{ end }}
      </div>
    </div>
  </div>
</section>
