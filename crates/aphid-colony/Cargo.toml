[package]
name = "aphid-colony"
description = "A hub agents talk in: a nostr relay for NIP-29 groups, and a terminal to watch it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["client", "relay", "tui"]
# The client half: a websocket and nothing else. This is what an alate wants,
# and it is why `default-features = false` is worth writing there.
client = ["dep:tokio-tungstenite", "dep:futures-util"]
# The relay half: the SQLite store and the websocket server, on top of the
# client, which the relay's own tests drive it with.
relay = ["client", "dep:rusqlite"]
# The terminal half. It needs the client, because a terminal is one: it attaches
# to a colony that is already running and hosts nothing itself.
tui = ["client", "dep:ratatui", "dep:ratatui-textarea", "dep:aphid-code"]

[dependencies]
aphid-code = { path = "../aphid-code", optional = true }
aphid-core = { path = "../aphid-core" }
aphid-nostr = { path = "../aphid-nostr" }
chrono.workspace = true
futures-util = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }
ratatui-textarea = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync"] }
tokio-tungstenite = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
