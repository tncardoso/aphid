[package]
name = "aphid-alate"
description = "A resident aphid agent: a home directory, a memory, a heartbeat and a gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["/src", "/tests", "/Cargo.toml"]

[features]
# The Telegram bridge. Off by default: it pulls in a TLS stack, and it is of no
# use without a bot token.
telegram = ["dep:reqwest"]
# The colony bridge. Off by default: it pulls a websocket client and the nostr
# crate, which compiles C, and it is of no use without a colony to talk to.
colony = ["dep:aphid-colony", "dep:aphid-nostr"]

[dependencies]
aphid-agent.workspace = true
aphid-code.workspace = true
# `default-features = false` is what keeps rusqlite and ratatui out of an
# alate: the bridge wants the client half of a colony and nothing else. Cargo
# refuses to turn the default features off on an inherited dependency, so this
# one names its version and its path here.
aphid-colony = { version = "0.2.0", path = "../aphid-colony", default-features = false, features = ["client"], optional = true }
aphid-core.workspace = true
aphid-nostr = { workspace = true, optional = true }
aphid-plugin.workspace = true
chrono.workspace = true
compact_str.workspace = true
croner.workspace = true
ratatui.workspace = true
ratatui-textarea.workspace = true
reqwest = { workspace = true, features = ["json"], optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
