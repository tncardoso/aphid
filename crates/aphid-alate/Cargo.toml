[package]
name = "aphid-alate"
description = "A resident aphid agent: a home directory, a memory, a heartbeat and a gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["/src", "/tests", "/examples", "/Cargo.toml"]

[features]
# The Telegram bridge. Off by default: it pulls in a TLS stack, and it is of no
# use without a bot token.
telegram = ["dep:reqwest"]
# The colony bridge. Off by default: it pulls a websocket client and the nostr
# crate, which compiles C, and it is of no use without a colony to talk to.
colony = ["dep:aphid-colony", "dep:aphid-nostr"]
# Speech to text, so a client that can carry audio can hand the agent words.
# Off by default, and by some distance the heaviest thing here: it pulls an
# ONNX runtime, and the model it reads is 670 MB on disk.
#
# It does not need `telegram`. The daemon is what fetches and holds the model,
# so the bridge is only the first client to ask it anything.
voice = [
    "dep:transcribe-rs",
    "dep:symphonia",
    "dep:opus-decoder",
    "dep:ogg",
    "dep:rubato",
    "dep:sha2",
    "dep:futures-util",
    "dep:reqwest",
]
# The graphical companion. It is a gateway client with a window, so it needs
# the window library and the component library the coding interface is drawn
# with — including that interface's theme, which is why it turns on the coding
# crate's own feature rather than mapping the palette a second time.
#
# The window owns a runtime of its own — the main thread belongs to GPUI — so
# it is the one part of an alate that needs more than one worker.
gui = [
    "dep:blade-graphics",
    "dep:blade-macros",
    "dep:bytemuck",
    "dep:gpui",
    "dep:gpui-component",
    "dep:image",
    "dep:ksni",
    "dep:objc2-app-kit",
    "dep:raw-window-handle",
    "dep:tray-icon",
    "dep:x11rb",
    "aphid-code/gui",
    "tokio/rt-multi-thread",
]

[dependencies]
aphid-agent.workspace = true
aphid-code.workspace = true
# `default-features = false` is what keeps rusqlite and ratatui out of an
# alate: the bridge wants the client half of a colony and nothing else. Cargo
# refuses to turn the default features off on an inherited dependency, so this
# one names its version and its path here.
aphid-colony = { version = "0.2.0", path = "../aphid-colony", default-features = false, features = ["client"], optional = true }
aphid-core.workspace = true
aphid-nostr = { workspace = true, optional = true }
chrono.workspace = true
compact_str.workspace = true
croner.workspace = true
blade-graphics = { workspace = true, optional = true }
blade-macros = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
gpui-component = { workspace = true, optional = true }
image = { workspace = true, optional = true }
ratatui.workspace = true
ratatui-textarea.workspace = true
reqwest = { workspace = true, features = ["json"], optional = true }
futures-util = { workspace = true, optional = true }
ogg = { workspace = true, optional = true }
opus-decoder = { workspace = true, optional = true }
rubato = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
transcribe-rs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# Placing the window is the one thing that cannot be written once for every
# desktop, so each of these is the half of it that system understands. Wayland
# is absent on purpose: no client places its own surface there.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ksni = { workspace = true, optional = true }
x11rb = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

# Only builds with ears on, since it is a transcriber and nothing else.
[[example]]
name = "voice"
required-features = ["voice"]
