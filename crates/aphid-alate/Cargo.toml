[package]
name = "aphid-alate"
description = "A resident aphid agent: a home directory, a memory, a heartbeat and a gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The Telegram bridge. Off by default: it pulls in a TLS stack, and it is of no
# use without a bot token.
telegram = ["dep:reqwest"]

[dependencies]
aphid-agent = { path = "../aphid-agent" }
aphid-code = { path = "../aphid-code" }
aphid-core = { path = "../aphid-core" }
aphid-plugin = { path = "../aphid-plugin" }
chrono.workspace = true
compact_str.workspace = true
croner.workspace = true
ratatui.workspace = true
ratatui-textarea.workspace = true
reqwest = { workspace = true, features = ["json"], optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "signal"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
