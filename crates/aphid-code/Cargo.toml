[package]
name = "aphid-code"
description = "A coding harness for the aphid agent: tools, project context, sessions and a terminal UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aphid-agent = { path = "../aphid-agent" }
aphid-core = { path = "../aphid-core" }
aphid-plugin = { path = "../aphid-plugin" }
chrono.workspace = true
compact_str.workspace = true
ratatui.workspace = true
ratatui-textarea.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "process", "sync"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
