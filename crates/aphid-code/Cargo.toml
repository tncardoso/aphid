[package]
name = "aphid-code"
description = "A coding harness for the aphid agent: tools, project context, sessions and user interfaces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["/src", "/tests", "/Cargo.toml"]

[features]
default = []
gui = ["dep:gpui", "dep:gpui-component", "dep:tinyvec"]

[dependencies]
aphid-agent.workspace = true
aphid-core.workspace = true
rhai = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
chrono.workspace = true
compact_str.workspace = true
gpui = { workspace = true, optional = true }
gpui-component = { workspace = true, optional = true }
tinyvec = { workspace = true, optional = true }
ratatui.workspace = true
ratatui-textarea.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "sync"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
