[package]
name = "aphid-code"
description = "A coding harness for the aphid agent: tools, project context, sessions and a terminal UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["/src", "/tests", "/Cargo.toml"]

[dependencies]
aphid-agent.workspace = true
aphid-core.workspace = true
rhai = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
chrono.workspace = true
compact_str.workspace = true
ratatui.workspace = true
ratatui-textarea.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "sync"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
