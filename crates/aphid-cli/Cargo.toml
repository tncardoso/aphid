[package]
name = "aphid-cli"
description = "Example driver that streams a DeepSeek completion and prints the events"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aphid"
path = "src/main.rs"

[dependencies]
aphid-agent = { path = "../aphid-agent" }
aphid-alate = { path = "../aphid-alate" }
aphid-code = { path = "../aphid-code" }
aphid-core = { path = "../aphid-core" }
aphid-plugin = { path = "../aphid-plugin" }
clap.workspace = true
futures-core.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
